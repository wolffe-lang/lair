# ci/games.conf — the games lair's own CI runs on the engine under test:
#   <job> <owner/repo> <ref> [<ref> ...]
# ci/stage-game clones the repository at the FIRST ref that exists (a
# branch, a tag or a commit), refuses one without a lair.pin, and stages
# this checkout as the clone's `.lair` (LAIR_UNPINNED=1: the point is the
# engine under test, not the pin). The refs: a game's open re-pin branch
# first while it is in flight, then trunk. A merged branch that nobody
# deleted still exists and is still taken first, so the branch leaves this
# line at its merge: pack's `cb00` (merged 2026-10-25, pack#25) stayed here
# and every run until r41q tested that head, 46 commits behind pack trunk.
pack wolffe-lang/pack trunk
cub wolffe-lang/cub trunk
