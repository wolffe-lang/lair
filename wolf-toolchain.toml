# lair — the pinned toolchain, for the engine and for every game that pins
# the engine (a game's tools are the engine's, run from its staged `.lair/`,
# so this one file names the compiler for the whole collection).
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256 digest,
# never from a source build (the shape yew, boreutils and pelt pin with).
# `tools/fetch-toolchain` downloads the archive for this host, refuses on a
# digest mismatch, and stages the whole archive into `.wolf-bin/`
# (gitignored); the native tier needs `libwolf_rt.a` beside the driver.
# Identity is the first line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`.
#
# ## The first pin: 0.2.35 / 0.1.56 (pack's pk00, 2026-10-25; moved here by cb00)
#
# Digests read twice from the release API (wolf-lang release `v0.2.35`,
# wolf-interp release `v0.1.56`; `gh release view --json assets`, two
# passes at 04:33:42Z, identical) and equal to yew's fourth pin (yw07).
# The std pin is the commit the 0.2.35 archive bundles (`std/STD-REV`),
# wolf-std 2386522e, confirmed from the downloaded archive by
# tools/fetch-toolchain. Windows is out of scope (pack is a POSIX terminal
# program); linux aarch64 is pinned so a future PAX or Pi lane has it.
#
# ## The second pin: 0.2.36 / 0.1.58 (r41q, 2026-11-01)
#
# Digests read twice from the release API (wolf-lang release `v0.2.36`,
# tag object 86d61559 peeling to 5adf3d91; wolf-interp release `v0.1.58`
# at 6240efe5; the assets' `digest` fields, two passes at 00:11:56Z and
# 00:11:57Z, identical) and equal to r41's published record; each pinned
# archive downloaded and hashed twice besides (linux x86-64 on hasu, the
# other two on nomad), identical. The std pin is the commit the 0.2.36
# archive bundles (`std/STD-REV`), wolf-std 78b9d3cb (sc72: the in-place
# List mutators, `fs.read_into`, the process and filesystem wrappers).
# 0.2.36 adds prelude names (`VaList` and the four `va_*`, `env_arg0`,
# `env_args_bytes`) that a shadowing declaration warns on; the engine and
# the games declare none. The release tier's mid-end fault (wolf-lang#940)
# is fixed after this tag, so `tools/build` keeps `WOLF_MIDEND=0` here.

